version: "3.9"

services:
  pipelead-db:
    image: mysql:8.0.29
    platform: linux/amd64
    container_name: pipelead-db
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_pipelead:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: db_pipelead
    networks:
      - pipelead

  pipelead-php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: pipelead-php
    ports:
      - 8000:8000
    volumes:
      - ./:/var/www/html
    networks:
      - pipelead
    depends_on:
      - pipelead-db
    command: >
      sh -c "composer install &&
             php artisan key:generate &&
             php artisan migrate --force &&
             php artisan db:seed &&
             php artisan serve --host=0.0.0.0 --port=8000"

  pipelead-vite:
    build:
      context: .
      dockerfile: Dockerfile.vite
    container_name: pipelead-vite
    ports:
      - 5173:5173
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    networks:
      - pipelead
    depends_on:
      - pipelead-php
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_pipelead:

networks:
  pipelead:
