services:
  pipelead-db:
    image: mysql:8.0.29
    platform: linux/amd64
    container_name: pipelead-db
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_pipelead:/var/lib/mysql
      - acs-project:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: db_pipelead
    networks:
      - pipelead
volumes:
  db_pipelead: {}
  acs-project: {}
networks:
  pipelead: null
